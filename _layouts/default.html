<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="icon" href="/favicon.png" type="image/png">
</head>
<body>
<div class="progress" id="progress"></div>
<header class="site-header">
  <nav class="nav container">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-dot"></span>Eicent</a>
    <div class="nav-links">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式"><span id="themeIcon">☾</span></button>
  </nav>
</header>
<main>{{ content }}</main>
<footer class="footer container"><span>© <span id="year"></span> Guojie Ni</span><span>Something is Creating.</span></footer>
<script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
